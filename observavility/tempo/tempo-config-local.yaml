server:
  http_listen_port: 3200
  grpc_listen_port: 4319

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
        http:

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 24h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

metrics_generator:
  registry:
    external_labels:
      source: tempo
      cluster: local

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]

stream_over_http_enabled: true