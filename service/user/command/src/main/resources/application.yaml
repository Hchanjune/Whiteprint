spring:
  application:
    name: api-command

adapter:

  security:
    verifier:
      policy:
        key-alias: access-token-sig
        expected-issuers:
          - Whiteprint
      entry-points:
        - path: /test
          method: GET
          decision: PERMIT
        - path: /test
          method: POST
          decision: PERMIT
      kms:
        datasource:
          host: localhost
          port: 8200
          password: root
          transit-path: transit
        cache:
          expires-after-write-minutes: 60
          maximum-size: 1000
      cache:
        datasource:
          host: localhost
          port: 6379
          password: ~
          database: 0
        pooling:
          enabled: true
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait-millis: -1
        timeout:
          command-timeout-millis: 2000
          shutdown-timeout-millis: 100

  event:
    publisher:
      infrastructure-implementation: kafka
      kafka:
        datasource:
          host: localhost
          port: 9092
        topic-policy:
          auto-create: true
          prefix: wp
          host:
          topic: topic
          version: v1
          default-partitions: 3
          default-replication-factor: 1
          retention-millis: 604800000
          cleanup-policy: delete
        producer:
          acks: all
          batch-size: 16384
          linger-millis: 5
          compression-type: lz4
          retries: 2147483647
        publish:
          retry:
            max-attempts: 3
            backoff-interval: 2000

    outbox:
      infrastructure-implementation: jpa

    subscriber:
      infrastructure-implementation: kafka
      kafka:
        datasource:
          host: localhost
          port: 9092
        consumer:
          group-id: platform-group
          auto-offset-reset: earliest
          concurrency: 3
          enable-auto-commit: false
          isolation-level: read_committed
        error-handling:
          retry:
            max-attempts: 3
            backoff-interval: 2000
          dead-letter:
            enabled: true
            topic-suffix: .DLT
            producer:
              acks: all
              batch-size: 16384
              linger-millis: 5
              compression-type: lz4
              retries: 2147483647


management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
    endpoint:
      prometheus:
        enabled: true
  observations:
    key-values:
      application: ${spring.application.name}


operation-manager:
  webmvc:
    mdc-service-aspect:
      enabled: true
    micrometer:
      enabled: true
    logging:
      enabled: true
      pretty: true
      json: true
      success-level: INFO
      failure-level: ERROR