spring:
  application:
    name: test

adapter:
  security:
    verifier:
      policy:
        key-alias: access-token-sig
        expected-issuers:
          - Whiteprint
      entry-points:
        - path: /test
          method: GET
          decision: PERMIT
        - path: /test
          method: POST
          decision: PERMIT
      kms:
        datasource:
          host: localhost
          port: 8200
          password: root
          transit-path: transit
        cache:
          expires-after-write-minutes: 60
          maximum-size: 1000
      cache:
        datasource:
          host: localhost
          port: 6379
          password: ~
          database: 0
        pooling:
          enabled: true
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait-millis: -1
        timeout:
          command-timeout-millis: 2000
          shutdown-timeout-millis: 100